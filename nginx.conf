server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA: fallback pro index.html (React Router etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pra assets com hash (Vite gera hashes)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # index.html NUNCA fica em cache sem revalidar. Sem Cache-Control o navegador
    # aplicava cache heuristico (horas, dependendo de quando mudou): depois de um
    # deploy o cliente seguia recebendo o index antigo, que aponta para o bundle
    # antigo (esse sim cacheado por 1 ano, por ter hash). "no-cache" nao impede
    # cache -- obriga a revalidar pelo ETag, que custa um 304 de poucos bytes.
    # Obs.: add_header aqui desliga a heranca dos cabecalhos do server{}, por isso
    # os de seguranca sao repetidos.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Service Worker: o arquivo real e /sw.js. A regra antiga protegia um
    # /service-worker.js que nao existe, e o sw.js caia no bloco de assets acima,
    # ganhando cache "imutavel" de 1 ano.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
