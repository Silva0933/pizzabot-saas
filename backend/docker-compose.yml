# ============================================
# PizzaBot — Dev local (espelha o Coolify)
# ============================================
# Uso:
#   docker compose up -d
#   docker compose exec backend python migrations/apply.py
#   docker compose logs -f backend worker

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pizzabot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pizzabot
      POSTGRES_PASSWORD: senha_forte
      POSTGRES_DB: pizzabot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzabot"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pizzabot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: .
    image: pizzabot-backend:latest
    container_name: pizzabot-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: [.env]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app                 # hot reload no dev
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts

  worker:
    image: pizzabot-backend:latest    # reusa a mesma imagem
    container_name: pizzabot-worker
    restart: unless-stopped
    depends_on:
      backend:  { condition: service_started }
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    env_file: [.env]
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
  redis_data:
