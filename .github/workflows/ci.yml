# CI — roda em todo push/PR: testes do backend (pytest) + type-check do frontend (tsc).
# A maioria dos testes usa mocks. Os de fila usam o Redis e os de integração o
# Postgres (com as migrations aplicadas do zero, o que também valida as migrations).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_SECRET_KEY: ci-secret-key-apenas-para-testes-0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      DATABASE_URL_SYNC: postgresql://ci:ci@localhost:5432/ci
      # Com REDIS_URL setado, os testes de integração do dispatcher (Lua do
      # scheduler, consumer group, XAUTOCLAIM, carga) rodam de verdade.
      REDIS_URL: redis://localhost:6379/0
      # Postgres real para os testes de integração (corrida de banco que mock
      # não pega, ex.: duas mensagens simultâneas de contato novo).
      PG_INTEGRACAO: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instala dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Migrations (banco limpo)
        run: python migrations/apply.py
      - name: Testes
        run: pytest tests -q

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instala dependências
        run: npm ci
      - name: Type-check
        run: npm run lint

  deploy:
    name: Deploy no Coolify
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publicar os cinco serviços do PizzaBot
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_TOKEN"
          curl --fail --show-error --silent --retry 3             --request POST             "https://coolify.secretariaai.eu.cc/api/v1/deploy"             --header "Authorization: Bearer $COOLIFY_TOKEN"             --header "Content-Type: application/json"             --data '{"uuid":"zeynn4npbe1k7n2rfk76wr66,i9yo82ez6qq8rrbuktwogzdz,w8llgwyn2i24do6hic4xhdsk,y6vkezy1f1iku9u5y2sy8i4a,w2h2loq5o8fmnvkfzazwrfrk","force":false}'